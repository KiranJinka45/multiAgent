version: '3.8'

services:
  ztan-core:
    build:
      context: ..
      dockerfile: docker/Dockerfile.core
    volumes:
      - ztan-state:/app/.ztan
    environment:
      - DATABASE_URL=file:/app/.ztan/ztan.db
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=info
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  ztan-state:
    driver: local
