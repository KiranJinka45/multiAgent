server {
  listen 80;

  # Static files
  location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri /index.html;
    
    # CSP: Production-Hardened Security (Reliability Dashboard)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' http://localhost:3010 http://127.0.0.1:3010; img-src 'self' data:; frame-src 'none';" always;
  }

  # Direct API access if needed (Core API)
  location /api/v1/ztan {
    proxy_pass http://core-api:3010;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
