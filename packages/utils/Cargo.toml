[package]
name = "ztan-utils-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
regex = "1.10"
base64 = "0.21"

[features]
snapshot-observability = []

[[bin]]
name = "ztan_dvk_bridge"
path = "src/dvk/bridges/rust_bridge.rs"

[lib]
name = "utils_rs"
path = "src/lib.rs"
