<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ZTAN Determinism Auditor v2.0</title>
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; background: #020617; color: #f8fafc; padding: 2rem; max-width: 1200px; margin: 0 auto; line-height: 1.6; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; padding-bottom: 1.5rem; margin-bottom: 2rem; }
        .status-badge { padding: 0.6rem 1.2rem; border-radius: 8px; font-weight: 700; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; border: 1px solid transparent; }
        .status-idle { background: #1e293b; color: #94a3b8; border-color: #334155; }
        .status-running { background: #1e40af; color: #93c5fd; border-color: #3b82f6; animation: pulse 2s infinite; }
        .status-success { background: #064e3b; color: #6ee7b7; border-color: #10b981; box-shadow: 0 0 20px rgba(16, 185, 129, 0.2); }
        .status-error { background: #7f1d1d; color: #fca5a5; border-color: #ef4444; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.5rem; margin-bottom: 2rem; }
        .stat-card { background: #0f172a; padding: 1.5rem; border-radius: 12px; border: 1px solid #1e293b; text-align: left; position: relative; overflow: hidden; }
        .stat-card::after { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: #3b82f6; opacity: 0.5; }
        .stat-value { font-size: 2.5rem; font-weight: 900; display: block; line-height: 1; margin-bottom: 0.5rem; color: #f8fafc; }
        .stat-label { font-size: 0.7rem; color: #64748b; text-transform: uppercase; font-weight: 600; letter-spacing: 0.1em; }
        
        .results-container { background: #0f172a; border-radius: 16px; border: 1px solid #1e293b; overflow: hidden; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .results-header { background: #1e293b; padding: 1rem 1.5rem; font-weight: 700; display: grid; grid-template-columns: 60px 1fr 1fr 140px; gap: 2rem; font-size: 0.8rem; color: #94a3b8; text-transform: uppercase; }
        .results-list { max-height: 600px; overflow-y: auto; scroll-behavior: smooth; }
        .result-item { padding: 1rem 1.5rem; display: grid; grid-template-columns: 60px 1fr 1fr 140px; gap: 2rem; border-bottom: 1px solid #1e293b; font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; align-items: center; transition: background 0.2s; }
        .result-item:hover { background: #1e293b44; }
        .result-item:last-child { border-bottom: none; }
        
        .sig-block { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: help; }
        .match-tag { color: #10b981; font-weight: bold; background: #064e3b44; padding: 0.2rem 0.6rem; border-radius: 4px; border: 1px solid #064e3b; text-align: center; }
        .mismatch-tag { color: #ef4444; font-weight: bold; background: #7f1d1d44; padding: 0.2rem 0.6rem; border-radius: 4px; border: 1px solid #7f1d1d; text-align: center; }
        
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h1 style="margin: 0; font-size: 1.5rem; letter-spacing: -0.02em;">ZTAN DETERMINISM AUDITOR <span style="color: #3b82f6; font-weight: 400;">v2.0</span></h1>
            <p style="margin: 0.2rem 0 0; color: #64748b; font-size: 0.9rem;">Empirical Cross-Runtime Parity Verification (RFC-001 v1.5)</p>
        </div>
        <div id="status-badge" class="status-badge status-idle">INITIALIZING</div>
    </div>

    <div class="stats-grid">
        <div class="stat-card"><span id="stat-total" class="stat-value">0</span><span class="stat-label">Total Randomized Vectors</span></div>
        <div class="stat-card"><span id="stat-processed" class="stat-value">0</span><span class="stat-label">Vectors Audited</span></div>
        <div class="stat-card" style="border-color: #064e3b;"><span id="stat-matches" class="stat-value" style="color: #10b981;">0</span><span class="stat-label">Bit-Perfect Matches</span></div>
        <div class="stat-card" style="border-color: #1e3a8a;"><span id="stat-rate" class="stat-value" style="color: #3b82f6;">0%</span><span class="stat-label">Verification Rate</span></div>
    </div>

    <div class="results-container">
        <div class="results-header">
            <span>ID</span>
            <span>Node.js Ground Truth</span>
            <span>Browser Implementation</span>
            <span>Verification</span>
        </div>
        <div id="results-list" class="results-list"></div>
    </div>

    <div id="final-report" style="margin-top: 2rem; padding: 1.5rem; border-radius: 12px; display: none;"></div>

    <script type="module">
        import { ThresholdBls } from './dist/index.mjs';

        const statusBadge = document.getElementById('status-badge');
        const resultsList = document.getElementById('results-list');
        const statTotal = document.getElementById('stat-total');
        const statProcessed = document.getElementById('stat-processed');
        const statMatches = document.getElementById('stat-matches');
        const statRate = document.getElementById('stat-rate');
        const finalReport = document.getElementById('final-report');

        async function runAudit() {
            statusBadge.textContent = 'AUDITING';
            statusBadge.className = 'status-badge status-running';

            try {
                // Use randomized vectors
                const vectorsResp = await fetch('./test-vectors-random.json');
                const nodeResultsResp = await fetch('./node-results-random.json');
                
                if (!vectorsResp.ok || !nodeResultsResp.ok) {
                    throw new Error("Failed to load test vectors. Ensure generate_parity_vectors.ts has run.");
                }

                const vectors = await vectorsResp.json();
                const nodeResults = await nodeResultsResp.json();
                
                statTotal.textContent = vectors.length;
                let matches = 0;

                for (let i = 0; i < vectors.length; i++) {
                    const v = vectors[i];
                    const nodeRes = nodeResults.find(r => r.id === v.id);
                    
                    // Run Browser Signing Parity Check
                    // v.shares contains subset of shares used by node
                    const browserSigShares = await Promise.all(v.shares.map(s => 
                        ThresholdBls.signShare(
                            v.messageHash,
                            s.secretShare,
                            v.ceremonyId,
                            v.threshold,
                            v.eligiblePublicKeys
                        )
                    ));

                    const browserAggregate = await ThresholdBls.aggregate(browserSigShares, v.subsetIndices);
                    const isMatch = browserAggregate === nodeRes.aggregateSignature;
                    
                    if (isMatch) matches++;

                    // Update UI
                    statProcessed.textContent = i + 1;
                    statMatches.textContent = matches;
                    statRate.textContent = `${Math.round((matches / (i + 1)) * 100)}%`;

                    const row = document.createElement('div');
                    row.className = 'result-item';
                    row.innerHTML = `
                        <span>#${v.id}</span>
                        <span class="sig-block" style="color: #94a3b8" title="${nodeRes.aggregateSignature}">${nodeRes.aggregateSignature.substring(0, 32)}...</span>
                        <span class="sig-block" style="color: #60a5fa" title="${browserAggregate}">${browserAggregate.substring(0, 32)}...</span>
                        <span class="${isMatch ? 'match-tag' : 'mismatch-tag'}">${isMatch ? 'PASSED' : 'FAILED'}</span>
                    `;
                    resultsList.prepend(row);

                    // Small delay to allow UI to breathe
                    if (i % 10 === 0) await new Promise(r => setTimeout(r, 10));
                }

                const allPassed = matches === vectors.length;
                statusBadge.textContent = allPassed ? 'CERTIFIED' : 'FAILED';
                statusBadge.className = 'status-badge ' + (allPassed ? 'status-success' : 'status-error');

                finalReport.style.display = 'block';
                if (allPassed) {
                    finalReport.style.background = '#064e3b22';
                    finalReport.style.border = '1px solid #064e3b';
                    finalReport.innerHTML = `
                        <h3 style="color: #10b981; margin-top: 0;">✅ EMPIRICAL PARITY PROVEN</h3>
                        <p style="margin-bottom: 0;">Successfully verified <strong>${matches}/${vectors.length}</strong> randomized cryptographic ceremonies across Node.js and Browser runtimes. No bit-deviations detected. Canonical serialization is stable.</p>
                    `;
                } else {
                    finalReport.style.background = '#7f1d1d22';
                    finalReport.style.border = '1px solid #7f1d1d';
                    finalReport.innerHTML = `
                        <h3 style="color: #ef4444; margin-top: 0;">❌ PARITY FAILURE</h3>
                        <p style="margin-bottom: 0;">Detected <strong>${vectors.length - matches}</strong> deviations in ${vectors.length} ceremonies. Cryptographic determinism is compromised.</p>
                    `;
                }

            } catch (e) {
                console.error(e);
                statusBadge.textContent = 'CRITICAL ERROR';
                statusBadge.className = 'status-badge status-error';
                finalReport.style.display = 'block';
                finalReport.style.background = '#7f1d1d22';
                finalReport.style.border = '1px solid #7f1d1d';
                finalReport.innerHTML = `<p style="color: #ef4444; margin: 0;">${e.message}</p>`;
            }
        }

        // Auto-run after short delay
        setTimeout(runAudit, 1000);
    </script>
</body>
</html>
