name: Build & Push

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.33.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build

      - name: Login to GHCR
        run: echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker Images
        run: |
          docker build -t ghcr.io/${{ github.repository }}/gateway:${{ github.sha }} ./apps/gateway
          docker build -t ghcr.io/${{ github.repository }}/core-api:${{ github.sha }} ./apps/core-api

      - name: Snyk Security Scan (Gateway)
        uses: snyk/actions/docker@master
        continue-on-error: true # Don't block build in this demo, but log issues
        with:
          image: ghcr.io/${{ github.repository }}/gateway:${{ github.sha }}
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository }}/gateway:${{ github.sha }}
          format: spdx-json
          output-file: gateway-sbom.spdx.json

      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository }}/core-api:${{ github.sha }}
          format: spdx-json
          output-file: core-api-sbom.spdx.json

      - name: Push Images
        run: |
          docker push ghcr.io/${{ github.repository }}/gateway:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}/core-api:${{ github.sha }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.2.4'

      - name: Sign the published container images
        run: |
          cosign sign --yes ghcr.io/${{ github.repository }}/gateway:${{ github.sha }}
          cosign sign --yes ghcr.io/${{ github.repository }}/core-api:${{ github.sha }}

      - name: Attest Build Provenance (Gateway)
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ghcr.io/${{ github.repository }}/gateway
          subject-digest: sha256:${{ github.sha }} # Pseudo-digest for demonstration

      - name: Attest Build Provenance (Core-API)
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ghcr.io/${{ github.repository }}/core-api
          subject-digest: sha256:${{ github.sha }} # Pseudo-digest for demonstration
