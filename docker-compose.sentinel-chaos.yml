version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: sentinel-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: multiagent
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - sentinel-chaos-net

  redis-master:
    image: redis:7
    container_name: redis-master
    command: ["redis-server", "--appendonly", "yes"]
    networks:
      - sentinel-chaos-net

  redis-replica-1:
    image: redis:7
    container_name: redis-replica-1
    command: ["redis-server", "--replicaof", "redis-master", "6379"]
    depends_on:
      - redis-master
    networks:
      - sentinel-chaos-net

  redis-replica-2:
    image: redis:7
    container_name: redis-replica-2
    command: ["redis-server", "--replicaof", "redis-master", "6379"]
    depends_on:
      - redis-master
    networks:
      - sentinel-chaos-net

  sentinel-1:
    image: redis:7
    container_name: sentinel-1
    entrypoint: >
      sh -c "
      redis_ip=\"\";
      while [ -z \"$$redis_ip\" ]; do
        echo 'Resolving redis-master...';
        redis_ip=$$(getent hosts redis-master | head -n 1 | awk '{print $$1}');
        [ -z \"$$redis_ip\" ] && sleep 1;
      done;
      echo \"Resolved redis-master to $$redis_ip\";
      echo 'port 26379' > /tmp/sentinel.conf &&
      echo \"sentinel monitor mymaster $$redis_ip 6379 2\" >> /tmp/sentinel.conf &&
      echo 'sentinel down-after-milliseconds mymaster 2000' >> /tmp/sentinel.conf &&
      echo 'sentinel failover-timeout mymaster 10000' >> /tmp/sentinel.conf &&
      echo 'sentinel parallel-syncs mymaster 1' >> /tmp/sentinel.conf &&
      redis-server /tmp/sentinel.conf --sentinel
      "
    depends_on:
      - redis-master
    networks:
      - sentinel-chaos-net

  sentinel-2:
    image: redis:7
    container_name: sentinel-2
    entrypoint: >
      sh -c "
      redis_ip=\"\";
      while [ -z \"$$redis_ip\" ]; do
        echo 'Resolving redis-master...';
        redis_ip=$$(getent hosts redis-master | head -n 1 | awk '{print $$1}');
        [ -z \"$$redis_ip\" ] && sleep 1;
      done;
      echo \"Resolved redis-master to $$redis_ip\";
      echo 'port 26379' > /tmp/sentinel.conf &&
      echo \"sentinel monitor mymaster $$redis_ip 6379 2\" >> /tmp/sentinel.conf &&
      echo 'sentinel down-after-milliseconds mymaster 2000' >> /tmp/sentinel.conf &&
      echo 'sentinel failover-timeout mymaster 10000' >> /tmp/sentinel.conf &&
      echo 'sentinel parallel-syncs mymaster 1' >> /tmp/sentinel.conf &&
      redis-server /tmp/sentinel.conf --sentinel
      "
    depends_on:
      - redis-master
    networks:
      - sentinel-chaos-net

  sentinel-3:
    image: redis:7
    container_name: sentinel-3
    entrypoint: >
      sh -c "
      redis_ip=\"\";
      while [ -z \"$$redis_ip\" ]; do
        echo 'Resolving redis-master...';
        redis_ip=$$(getent hosts redis-master | head -n 1 | awk '{print $$1}');
        [ -z \"$$redis_ip\" ] && sleep 1;
      done;
      echo \"Resolved redis-master to $$redis_ip\";
      echo 'port 26379' > /tmp/sentinel.conf &&
      echo \"sentinel monitor mymaster $$redis_ip 6379 2\" >> /tmp/sentinel.conf &&
      echo 'sentinel down-after-milliseconds mymaster 2000' >> /tmp/sentinel.conf &&
      echo 'sentinel failover-timeout mymaster 10000' >> /tmp/sentinel.conf &&
      echo 'sentinel parallel-syncs mymaster 1' >> /tmp/sentinel.conf &&
      redis-server /tmp/sentinel.conf --sentinel
      "
    depends_on:
      - redis-master
    networks:
      - sentinel-chaos-net

  drill-runner:
    image: node:20-slim
    container_name: drill-runner
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /app
    environment:
      - REDIS_SENTINEL_HOSTS=sentinel-1:26379,sentinel-2:26379,sentinel-3:26379
      - REDIS_SENTINEL_NAME=mymaster
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/multiagent?schema=public
      - REDIS_ENABLE_OFFLINE_QUEUE=false
      - REDIS_COMMAND_TIMEOUT=2000
    networks:
      - sentinel-chaos-net
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "
      apt-get update && apt-get install -y --no-install-recommends curl ca-certificates &&
      curl -fsSL https://download.docker.com/linux/static/stable/x86_64/docker-26.1.4.tgz | tar -xz -C /tmp &&
      mv /tmp/docker/docker /usr/local/bin/ &&
      npx prisma db push --schema=packages/db/prisma/schema.prisma --accept-data-loss &&
      npx tsx scripts/redis-sentinel-drill.ts
      "

networks:
  sentinel-chaos-net:
    driver: bridge
