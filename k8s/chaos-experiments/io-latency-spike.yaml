apiVersion: chaos-mesh.org/v1alpha1
kind: IOChaos
metadata:
  name: postgres-io-latency
  namespace: multiagent
spec:
  action: latency
  mode: all
  selector:
    labelSelectors:
      app: postgres
  volumePath: /var/lib/postgresql/data
  path: /var/lib/postgresql/data/**/*
  delay: '500ms'
  percent: 100
  duration: '30s'
  scheduler:
    cron: '@every 30m'
