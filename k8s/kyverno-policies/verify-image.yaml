apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-image-signature
  annotations:
    policies.kyverno.io/title: Verify Image Signatures
    policies.kyverno.io/category: Software Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Enforces that all images deployed to the multiagent namespace have been cryptographically
      signed by our CI/CD pipeline using Sigstore Cosign.
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    - name: verify-cosign-signatures
      match:
        any:
        - resources:
            kinds:
              - Pod
            namespaces:
              - multiagent
      verifyImages:
      - imageReferences:
        - "ghcr.io/KiranJinka45/multiAgent/*"
        attestors:
        - count: 1
          entries:
          - keys:
              publicKeys: |-
                -----BEGIN PUBLIC KEY-----
                MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE/PlaceholderPublicKeyString
                -----END PUBLIC KEY-----
