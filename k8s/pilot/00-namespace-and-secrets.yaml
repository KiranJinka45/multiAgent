  REDIS_URL: "redis://redis:6379"
  AUTH_SERVICE_URL: "https://auth-service:4002"
  BILLING_SERVICE_URL: "http://billing-service:4003"
  CORE_API_URL: "http://core-api:4001"
  GATEWAY_PORT: "4081"
  AUTH_SERVICE_PORT: "4002"
  WORKER_PORT: "8082"
  NODE_ENV: "production"
  PORT: "4081"
  ZTAN_MOCK_TPM: "true"
  INTERNAL_SERVICE_TOKEN: "pilot-a5eaf053dad9ae020e288a15616cd532467080afd1c6a526a7d704b7320bebc2"
  NO_CLUSTER: "true"
  NODE_TLS_REJECT_UNAUTHORIZED: "0"
---
# ── Pilot Worker/Core Secrets ───────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: pilot-core-secrets
  namespace: ztan-pilot
type: Opaque
