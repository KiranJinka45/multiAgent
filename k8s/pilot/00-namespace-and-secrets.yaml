# ── ZTAN Pilot Namespace ────────────────────────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: ztan-pilot
  labels:
    purpose: pilot-deployment
    ztan-version: v1.15.0
    isolation: strict
---
# ── Pilot Auth Secrets ──────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: pilot-auth-secrets
  namespace: ztan-pilot
type: Opaque
stringData:
  JWT_SECRET: "pilot-hardened-jwt-signing-key-entropy-mesh-v1"
  INTERNAL_KEY: "pilot-hardened-internal-service-communication-key-v1"
  JWT_REFRESH_SECRET: "pilot-hardened-refresh-token-signing-key-v1"
  DATABASE_URL: "postgresql://postgres:pilot-password@postgres:5432/ztan_pilot"
  AUTH_SERVICE_PORT: "4002"
  GATEWAY_PORT: "4081"
  WORKER_PORT: "8082"
  ZTAN_MOCK_TPM: "true"
  INTERNAL_SERVICE_TOKEN: "pilot-a5eaf053dad9ae020e288a15616cd532467080afd1c6a526a7d704b7320bebc2"
  NODE_ENV: "production"
  PORT: "4002"
  REDIS_URL: "redis://redis:6379"
  AUTH_SERVICE_URL: "https://auth-service:4002"
  CORE_API_URL: "http://core-api:4001"
  BILLING_SERVICE_URL: "http://billing-service:4003"
  NO_CLUSTER: "true"
  NODE_TLS_REJECT_UNAUTHORIZED: "0"
---
# ── Pilot Gateway Secrets ───────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: pilot-gateway-secrets
  namespace: ztan-pilot
type: Opaque
